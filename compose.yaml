x-ecourse-environment: &ecourse-environment
  ECOURSE_ENV: local
  ECOURSE_BASE_URL: http://localhost:8765
  ECOURSE_ALLOWED_HOSTS: localhost,127.0.0.1
  ECOURSE_DATABASE_URL: postgresql+psycopg://ecourse:${POSTGRES_PASSWORD}@postgres:5432/ecourse
  ECOURSE_DATA_DIR: /var/lib/ecourse/data
  ECOURSE_SECRET_DIR: /var/lib/ecourse/secrets
  ECOURSE_RUNTIME_DIR: /run/ecourse
  ECOURSE_CHROMIUM_SANDBOX: "false"

x-ecourse-service: &ecourse-service
  build:
    context: .
  image: ecourse-app:local
  environment: *ecourse-environment
  volumes:
    - ./.secrets:/var/lib/ecourse/secrets
    - ecourse-runtime:/run/ecourse
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecourse
      POSTGRES_USER: ecourse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecourse -d ecourse"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *ecourse-service
    command: ["ecourse", "migrate"]
    restart: "no"

  web:
    <<: *ecourse-service
    command: ["ecourse", "serve", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *ecourse-service
    command: ["ecourse", "worker"]
    restart: unless-stopped
    init: true
    shm_size: 1gb
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  import-sqlite:
    <<: *ecourse-service
    command: ["ecourse", "import-sqlite", "/legacy/ecourse.sqlite3"]
    profiles: ["tools"]
    volumes:
      - ./.secrets:/var/lib/ecourse/secrets
      - ./.data:/legacy:ro
      - ecourse-runtime:/run/ecourse

  backup:
    image: postgres:17-bookworm
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/scripts/postgres_backup.sh"]
    volumes:
      - ./scripts/postgres_backup.sh:/scripts/postgres_backup.sh:ro
      - ./.backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  restore:
    image: postgres:17-bookworm
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ALLOW_RESTORE: ${ALLOW_RESTORE:-no}
      RESTORE_FILE: ${RESTORE_FILE:-}
    entrypoint: ["/bin/sh", "/scripts/postgres_restore.sh"]
    volumes:
      - ./scripts/postgres_restore.sh:/scripts/postgres_restore.sh:ro
      - ./.backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  ecourse-runtime:
