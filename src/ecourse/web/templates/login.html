<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入 · eCourse</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-page" data-csrf="{{ csrf_token }}"><main class="login-card"><a class="brand" href="/"><span>e</span>Course</a><h1>登入</h1>
{% if initialized %}<form id="login-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>校務帳號<input name="login_name" autocomplete="username" required autofocus></label><label>校務密碼<input name="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="error" role="alert"></p><button type="submit">登入</button></form><div id="login-challenge" aria-live="polite"></div>
{% else %}<section class="empty"><h2>歡迎使用 eCourse</h2><p>這是第一次啟動。按下按鈕後會在這台主機建立加密金鑰與本機資料庫；完成後以校務帳密登入。</p><form id="setup-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit">開始設定</button><p id="setup-error" class="error" role="alert"></p></form></section>{% endif %}
</main><script src="/static/app.js" defer></script></body></html>
