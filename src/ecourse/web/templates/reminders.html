{% extends "base.html" %}{% block content %}<div class="settings-tabs"><a href="/settings/connections">{{ t('連接') }}</a><a class="active" href="/settings/reminders">{{ t('提醒') }}</a><a href="/settings/appearance">{{ t('外觀') }}</a><a href="/status">{{ t('系統狀態') }}</a></div><section class="panel narrow"><h2>{{ t('摘要與提醒') }}</h2><form id="reminder-form"><label class="check"><input name="daily_enabled" type="checkbox" {{ 'checked' if not data or data.get('daily_enabled',true) }}>{{ t('每日摘要') }}</label><label>{{ t('每日時間') }}<input name="daily_time" type="time" value="{{ data.get('daily_time','08:00') if data else '08:00' }}"></label><label class="check"><input name="weekly_enabled" type="checkbox" {{ 'checked' if not data or data.get('weekly_enabled',true) }}>{{ t('每週摘要') }}</label><label>{{ t('每週時間') }}<input name="weekly_time" type="time" value="{{ data.get('weekly_time','20:00') if data else '20:00' }}"></label><div class="two"><label>{{ t('安靜開始') }}<input name="quiet_start" type="time" value="{{ data.get('quiet_start','23:00') if data else '23:00' }}"></label><label>{{ t('安靜結束') }}<input name="quiet_end" type="time" value="{{ data.get('quiet_end','07:00') if data else '07:00' }}"></label></div><label>{{ t('提前提醒（小時，以逗號分隔）') }}<input name="lead_hours" value="{{ data.get('lead_hours',[24,3])|join(',') if data else '24,3' }}"></label><button type="submit">{{ t('儲存設定') }}</button></form><aside class="callout"><strong>{{ t('瀏覽器推播尚未開放') }}</strong><p>{{ t('目前僅支援站內通知。') }}</p></aside></section>{% endblock %}
