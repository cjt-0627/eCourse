[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecourse-server"
version = "0.1.0"
description = "eCourse 自架課務整合網站"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=44", "playwright>=1.50", "fastapi>=0.115", "uvicorn>=0.34",
  "jinja2>=3.1", "python-multipart>=0.0.20", "sqlalchemy>=2.0", "alembic>=1.15",
  "argon2-cffi>=23.1", "httpx>=0.28", "beautifulsoup4>=4.13", "bleach>=6.2",
]

[project.scripts]
ecourse = "ecourse.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ecourse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
